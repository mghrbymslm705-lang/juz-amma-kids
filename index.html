<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="app_icon_32.png">
<link rel="apple-touch-icon" href="app_icon_192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B6E4F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="براعم جوهرة">
<title>براعم جوهرة 🌙 — معاينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#0B6E4F; --gold:#D4A94B; --purple:#7C6CE0; --coral:#EF6C57;
    --sky:#4A90C2; --cream:#FFF8EE; --green:#2EA86F; --red:#E05252;
    --ink:#232323;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Amiri',serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  .screen{display:none;max-width:520px;margin:0 auto;padding:16px;}
  .screen.active{display:block;animation:fade .25s;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .topbar h1{font-size:26px;font-weight:700;}
  .topbar .spacer{flex:1;}
  .tbtn{border:none;background:transparent;font-family:'Amiri',serif;font-size:15px;font-weight:700;
    color:var(--primary);background:rgba(11,110,79,.12);border-radius:14px;padding:6px 10px;cursor:pointer;}
  .tbtn.purple{color:var(--purple);background:rgba(124,108,224,.14);}

  .summary{background:linear-gradient(135deg,#0B6E4F,#2EA86F);border-radius:18px;padding:14px;color:#fff;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
  .summary .barwrap{flex:1;}
  .summary h3{font-size:16px;font-weight:700;}
  .bar{height:10px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:6px;}
  .bar>div{height:100%;background:#FFD54F;border-radius:8px;transition:width .4s;}
  .stat{text-align:center;min-width:54px;}
  .stat .v{font-size:22px;font-weight:700;color:#FFD54F;}
  .stat .l{font-size:11px;color:#fff;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .card{border-radius:20px;padding:12px;color:#fff;position:relative;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.18);display:flex;flex-direction:column;min-height:150px;}
  .card .emoji{font-size:26px;}
  .card .num{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.22);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700;}
  .card .nm{font-size:19px;font-weight:700;margin-top:auto;}
  .card .idea{font-size:12px;opacity:.92;}
  .card .stars{font-size:14px;margin-top:4px;letter-spacing:2px;}
  .card .done{font-size:11px;margin-top:2px;}

  .shead{border-radius:20px;padding:16px;color:#fff;text-align:center;margin-bottom:14px;}
  .shead .emoji{font-size:40px;}
  .shead h2{font-size:24px;font-weight:700;}
  .shead .idea{font-size:14px;opacity:.92;}
  .shead .stars{font-size:22px;margin-top:6px;letter-spacing:3px;}
  .shead .meta{font-size:12px;opacity:.85;margin-top:4px;}

  .modes{display:flex;gap:10px;margin-bottom:16px;}
  .mode{flex:1;border-radius:18px;padding:14px 6px;color:#fff;text-align:center;cursor:pointer;font-family:'Amiri',serif;border:none;font-size:19px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.18);}
  .mode .i{font-size:30px;display:block;margin-bottom:6px;}
  .mode.sky{background:linear-gradient(135deg,#4A90C2,#3a6f99);}
  .mode.coral{background:linear-gradient(135deg,#EF6C57,#c8503c);}
  .mode.purple{background:linear-gradient(135deg,#7C6CE0,#5b4cb8);}

  .status{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:10px;border:2px solid #eee;}
  .status .ic{font-size:24px;}
  .status h4{font-size:16px;font-weight:700;}
  .status p{font-size:12px;color:#777;}
  .status .ok{margin-inline-start:auto;color:var(--green);font-size:22px;font-weight:700;}

  .chip{display:inline-block;background:rgba(255,255,255,.9);border-radius:30px;padding:5px 14px;font-size:15px;margin:0 auto 10px;box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .lessonframe{border:3px solid var(--gold);border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);margin-bottom:12px;}
  .lessonframe .lfhead{background:linear-gradient(135deg,var(--gold),#b8860b);color:#fff;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;}
  .lessonframe .lfbody{padding:14px 12px;}
  .lessonframe .lfbody .ay{font-family:'Amiri Quran','Amiri',serif;font-size:25px;line-height:2.1;text-align:center;padding:5px 6px;border-radius:10px;margin-bottom:5px;transition:opacity .2s;}
  .lessonframe .lfbody .ay.cur{background:rgba(11,110,79,.13);box-shadow:inset 0 0 0 2px rgba(11,110,79,.28);}
  .lessonframe .lfbody .ay.done{opacity:.4;}
  .lessonfoot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 10px;}
  .lnbtn{border:none;background:#fff;border:2px solid #ddd;border-radius:30px;padding:4px 12px;font-family:'Amiri',serif;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);}
  .lnbtn.on{background:var(--primary);border-color:var(--primary);color:#fff;}
  .lnbtn.ok{background:var(--green);border-color:var(--green);color:#fff;}
  .recchips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 12px;}
  .recchip{border:none;border-radius:30px;padding:6px 14px;font-family:'Amiri',serif;font-size:15px;font-weight:700;cursor:pointer;background:#fff;border:2px solid var(--sky);color:var(--sky);}
  .recchip.sel{background:var(--sky);color:#fff;}
  .scopechips{display:flex;justify-content:center;gap:8px;margin:8px 0;}
  .scopechip{border:none;border-radius:14px;padding:8px 12px;font-family:'Amiri',serif;font-size:15px;font-weight:700;cursor:pointer;background:#fff;border:2px solid var(--coral);color:var(--coral);}
  .scopechip.sel{background:var(--coral);color:#fff;}
  .controls{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0;}
  .cbtn{border:none;border-radius:50%;width:56px;height:56px;font-size:24px;color:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2);}
  .cbtn.small{width:44px;height:44px;font-size:20px;background:rgba(0,0,0,.08);color:inherit;}
  .cbtn:disabled{opacity:.4;cursor:default;}
  .optchips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0 14px;}
  .ochip{border:none;background:#fff;border:2px solid var(--gold);border-radius:30px;padding:6px 14px;font-family:'Amiri',serif;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);}
  .ochip.sel{background:var(--gold);color:#fff;}
  .sliderrow{display:flex;align-items:center;gap:8px;justify-content:center;font-size:15px;margin-bottom:10px;}
  .sliderrow input{width:160px;}

  .opt{border-radius:16px;padding:12px;margin-bottom:10px;background:#fff;border:2px solid rgba(11,110,79,.25);cursor:pointer;font-family:'Amiri Quran','Amiri',serif;font-size:16px;line-height:1.8;text-align:center;}
  .opt.correct{background:var(--green);color:#fff;border-color:var(--green);}
  .opt.wrong{background:var(--red);color:#fff;border-color:var(--red);animation:shake .3s;}
  .opt.dim{opacity:.45;}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .btn{display:block;width:100%;border:none;border-radius:16px;padding:12px;font-family:'Amiri',serif;font-size:19px;font-weight:700;cursor:pointer;color:#fff;margin-top:10px;}
  .btn.primary{background:var(--primary);}
  .btn.gold{background:var(--gold);}
  .btn.red{background:var(--red);}
  .btn.outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}

  .row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:8px;border:1px solid #eee;}
  .row .nm{font-weight:700;font-size:16px;}
  .row .sub{font-size:11px;color:#999;}
  .row .r{flex:1;}
  .row .stars{letter-spacing:2px;font-size:16px;}
  .row .ok{color:var(--green);font-size:18px;font-weight:700;}

  .panel{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;}
  .panel h3{font-size:18px;font-weight:700;margin-bottom:8px;}
  .panel p{font-size:13px;color:#555;line-height:1.7;}

  /* احتفال */
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;}
  .celebrate .box{background:#fff;border-radius:24px;padding:24px;text-align:center;max-width:320px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,.3);}
  .celebrate .box .big{font-size:56px;}
  .celebrate .box h2{color:var(--primary);font-size:24px;font-weight:700;margin:6px 0;}
  .celebrate .box p{color:#333;font-size:16px;}
  .celebrate .box .stars{font-size:28px;margin:8px 0;letter-spacing:4px;}
  .confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:51;border-radius:2px;animation:fall linear forwards;pointer-events:none;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9;}}

  .hidden{display:none;}
  .loadnote{text-align:center;color:#777;font-size:14px;margin:6px 0;}
  .err{color:var(--red);text-align:center;font-size:14px;margin:6px 0;}
</style>
</head>
<body>

<div id="home" class="screen active">
  <div class="topbar">
    <span style="font-size:30px;">🌙</span>
    <h1>براعم جوهرة</h1>
    <span class="spacer"></span>
    <button class="tbtn" onclick="go('board')">🏆 لوحتي</button>
    <button class="tbtn purple" onclick="go('parents')">👨‍👩‍👧 الوالدين</button>
    <button class="tbtn" id="installBtn" style="display:none" onclick="installApp()">📲 تثبيت</button>
  </div>
  <div class="summary">
    <div class="barwrap">
      <h3 id="sumTitle">حفظت 0 من 37 سورة</h3>
      <div class="bar"><div id="sumBar" style="width:0%"></div></div>
    </div>
    <div class="stat"><div class="v" id="sumStars">0</div><div class="l">نجمة ⭐</div></div>
    <div class="stat"><div class="v" id="sumStreak">0</div><div class="l">أيام 🔥</div></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="surah" class="screen"></div>
<div id="listen" class="screen"></div>
<div id="repeat" class="screen"></div>
<div id="quiz" class="screen"></div>
<div id="board" class="screen"></div>
<div id="parents" class="screen"></div>

<script>

function prog(n){ S.progress[n]=S.progress[n]||{stars:0,listened:false,repeated:false,quiz:false,last:null,lessons:{}}; return S.progress[n]; }
function recordActivity(){ if(!S.days.includes(today())){S.days.push(today());save();} }
function stars(n){return prog(n).stars;}
function mark(n,k){const p=prog(n);p[k]=true;p.last=today();refreshSurahFlags(n);recordActivity();save();}
function streak(){const d=new Date();const set=new Set(S.days);
  if(!set.has(dayKey(d))){d.setDate(d.getDate()-1); if(!set.has(dayKey(d)))return 0;}
  let c=0; while(set.has(dayKey(d))){c++;d.setDate(d.getDate()-1);} return c;}
function summary(){let st=0,comp=0,ayahs=0,all=0; SU.forEach(s=>{all+=s.aya.length;const p=prog(s.n);st+=p.stars;if(p.stars>=3){comp++;ayahs+=s.aya.length;}});return {st,comp,all,ayahs};}

function shade(hexc,amt){hexc=hexc.replace('#','');let r=parseInt(hexc.substr(0,2),16),g=parseInt(hexc.substr(2,2),16),b=parseInt(hexc.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');}

/* ---------- محرك الصوت ---------- */
const audio=new Audio();
audio.preload='auto';
let mode=null; let qIdx=0; let lessonIdx=0; let repeatCount=3; let speed=1; let scope='lesson';
function rawTiming(n){return TIMING[n]||[];}
const estCache={};
function estTiming(n){
  if(estCache[n])return estCache[n];
  const s=SU.find(x=>x.n===n);
  let t=4000, list=[];
  s.aya.forEach((a,i)=>{
    const dur=Math.max(2200,a.t.length*150)+260;
    list.push({n:a.n,s:t,e:t+dur}); t+=dur;
  });
  estCache[n]=list; return list;
}
function silenceKey(n){return reciter.id+'_'+n;}
function timingReady(n){return !!(reciter.hasTiming||silenceCache[silenceKey(n)]);}
function timingMap(n){
  const k=silenceKey(n);
  if(!reciter.hasTiming){
    if(silenceCache[k]){const m={};silenceCache[k].forEach(t=>m[t.n]=t);return m;}
    return null;
  }
  const m={};
  rawTiming(n).forEach(t=>m[t.n]=t);
  return m;
}
function basmalaInfo(n){
  const k=silenceKey(n);
  if(reciter.hasTiming){
    const r=rawTiming(n);
    if(r&&r.length&&r[0]&&r[0].s>0)return {s:0,e:r[0].s};
    return null;
  }
  const list=silenceCache[k];
  if(list&&list._bas)return list._bas;
  return null;
}
function loadSurah(n){
  const file=surahUrl(n);
  if(!file)return;
  if(audio.getAttribute('src')!==file){audio.src=file;audio.load();}
  audio.playbackRate=speed;
  const k=silenceKey(n);
  if(!reciter.hasTiming&&!silenceCache[k]&&!loadingSilence[k]){
    loadingSilence[k]=true;
    computeTiming(n).catch(()=>{}).finally(()=>{loadingSilence[k]=false;});
  }
}
const silenceCache={};
const loadingSilence={};
async function computeTiming(n){
  const k=silenceKey(n);
  try{const cached=JSON.parse(localStorage.getItem('ammaSilence2')||'{}');
    if(cached[k]){silenceCache[k]=cached[k];return;}}catch(e){}
  const url=surahUrl(n);
  if(!url)return;
  let detected=false;
  try{
    const res=await fetch(url);
    const buf=await res.arrayBuffer();
    const AC=window.AudioContext||window.webkitAudioContext;
    const actx=new AC();
    try{
      const ab=await actx.decodeAudioData(buf);
      const list=detectTiming(SU.find(x=>x.n===n).aya,ab);
      if(list){silenceCache[k]=list;detected=true;}
    }finally{actx.close();}
  }catch(e){}
  if(!detected){silenceCache[k]=estTiming(n);}
  else{try{const c=JSON.parse(localStorage.getItem('ammaSilence2')||'{}');c[k]=silenceCache[k];localStorage.setItem('ammaSilence2',JSON.stringify(c));}catch(e){}}
}
function detectTiming(ayahs,ab){
  const ch=ab.getChannelData(0);
  const sr=ab.sampleRate;
  const FR=1024, frames=Math.floor(ch.length/FR);
  const rms=new Float32Array(frames);
  let peak=0;
  for(let i=0;i<frames;i++){let sum=0;const o=i*FR;
    for(let j=0;j<FR;j++){const v=ch[o+j];sum+=v*v;}
    rms[i]=Math.sqrt(sum/FR); if(rms[i]>peak)peak=rms[i];}
  const sorted=Float32Array.from(rms).sort();
  const noise=sorted[Math.floor(frames*0.1)]||0;
  const th=Math.max(0.006,noise*6,peak*0.02);
  const speech=new Uint8Array(frames);
  for(let i=0;i<frames;i++)speech[i]=rms[i]>th?1:0;
  let firstSp=-1,lastSp=-1;
  for(let i=0;i<frames;i++){if(speech[i]){if(firstSp<0)firstSp=i;lastSp=i;}}
  if(firstSp<0)return null;
  const startMs=firstSp*FR/sr*1000;
  const endMs=(lastSp+1)*FR/sr*1000;
  const N=ayahs.length;
  const need=N-1;
  const minDurs=[250,200,160,120,90,60];
  for(const minDur of minDurs){
    const pauses=[];
    let i=0;
    while(i<frames){
      if(speech[i]===0){const st=i;while(i<frames&&speech[i]===0)i++;
        const dur=(i-st)*FR/sr*1000;
        if(dur>=minDur)pauses.push({s:st*FR/sr*1000,e:i*FR/sr*1000});
      }else i++;
    }
    const gaps0=pauses.filter(p=>p.e>startMs+50&&p.s<endMs-50);
    const tries=[gaps0.slice()];
    if(gaps0.length>=need+1&&(gaps0[0].s-startMs)<20000)tries.push(gaps0.slice(1));
    for(let g of tries){
      if(g.length>need){g=g.slice().sort((a,b)=>(b.e-b.s)-(a.e-a.s));g=g.slice(0,need).sort((a,b)=>a.s-b.s);}
      if(g.length!==need)continue;
      const droppedGap=(tries.length>1&&g===tries[1])?gaps0[0]:null;
      const starts=[droppedGap?droppedGap.e:startMs];
      g.forEach(b=>starts.push(b.e));
      const list=[];
      for(let k=0;k<N;k++){
        list.push({n:ayahs[k].n,s:Math.round(starts[k]||0),e:Math.round(k+1<starts.length?starts[k+1]:endMs)});
      }
      list._bas=droppedGap?{s:Math.round(startMs),e:Math.round(droppedGap.e)}:null;
      return list;
    }
  }
  return null;
}
function seekSurahStart(n,idx){
  const start=Math.max(0,(currentAyahStart(n,idx)-30)/1000);
  const doIt=()=>{
    audio.pause();
    if(Math.abs(audio.currentTime-start)<0.05){safePlay();return;}
    try{audio.currentTime=start;}catch(e){}
    let done=false,tries=0,timer=null;
    const fire=()=>{if(done)return;done=true;if(timer)clearTimeout(timer);audio.removeEventListener('seeked',check);safePlay();};
    const check=()=>{
      if(done)return;
      if(Math.abs(audio.currentTime-start)<0.06){fire();return;}
      if(++tries>120){done=true;if(timer)clearTimeout(timer);audio.removeEventListener('seeked',check);return;}
      timer=setTimeout(check,100);
    };
    audio.addEventListener('seeked',check);
    timer=setTimeout(check,120);
  };
  if(audio.readyState>=1)doIt();
  else audio.addEventListener('loadedmetadata',function h(){audio.removeEventListener('loadedmetadata',h);doIt();});
}
function safePlay(){
  const p=audio.play();
  if(p&&p.catch)p.catch(()=>{updatePlayBtn();setErr();});
}
document.addEventListener('pointerdown',function unlock(){
  if(audio.getAttribute('src')){const p=audio.play();if(p&&p.catch)p.catch(()=>{});audio.pause();}
},{once:true});
function currentAyahStart(n,idx){
  if(idx===-1){const b=basmalaInfo(n);return b?b.s:0;}
  const s=SU.find(x=>x.n===n);const a=s.aya[idx];const m=timingMap(n);if(!m)return 0;const t=m[a.n];return t?t.s:0;}
function currentAyahEnd(n,idx){
  if(idx===-1){const b=basmalaInfo(n);return b?b.e:0;}
  const s=SU.find(x=>x.n===n);const a=s.aya[idx];const m=timingMap(n);if(!m)return 0;const t=m[a.n];if(t)return t.e;return 0;}
function playbackEnd(n,idx){
  if(idx===-1){const b=basmalaInfo(n);return b?b.e:0;}
  const s=SU.find(x=>x.n===n);const a=s.aya[idx];const m=timingMap(n);if(!m)return 0;const t=m[a.n];if(!t)return 0;
  const cur=(idx<s.aya.length-1)?Math.min(Math.max(t.s+400,t.e-200),t.e-50):t.e;
  if(idx<s.aya.length-1&&mode==='repeat'&&BOUND[n]&&BOUND[n][a.n]!=null){
    const b=BOUND[n][a.n];
    if(b>=cur)return b;
    if(scope==='ayah')return b;
  }
  return cur;}

/* ---------- محرك الحصص ---------- */
function lessonsFor(n){const s=SU.find(x=>x.n===n);const cnt=Math.max(1,ayahsPerLesson);const L=[];
  for(let i=0;i<s.aya.length;i+=cnt)L.push({start:i,end:Math.min(i+cnt,s.aya.length)-1});return L;}
function lessonRange(n,li){const L=lessonsFor(n);li=Math.max(0,Math.min(li,L.length-1));return L[li];}
function currentRange(){
  if(mode==='repeat'&&scope==='surah')return {start:0,end:SU.find(x=>x.n===curSurah).aya.length-1,tag:'السورة كاملة'};
  const L=lessonsFor(curSurah);return {r:lessonRange(curSurah,lessonIdx),tag:'الحصة '+(lessonIdx+1)+' من '+L.length};}
function lessonDone(n,li,k){
  const p=prog(n); p.lessons=p.lessons||{}; const x=p.lessons[li]=p.lessons[li]||{}; x[k]=true;
  p.last=today(); refreshSurahFlags(n); recordActivity(); save();
}
function refreshSurahFlags(n){
  const p=prog(n); const L=lessonsFor(n);
  const all=(k)=>{for(const l of L){const x=p.lessons&&p.lessons[L.indexOf(l)];if(!x||!x[k])return false;}return true;};
  if(L.length&&all('listened')&&!p.listened){p.listened=true;}
  if(L.length&&all('repeated')&&!p.repeated){p.repeated=true;}
  if(p.listened&&p.stars<1)p.stars=1; if(p.repeated&&p.stars<2)p.stars=2; if(p.quiz)p.stars=3;
}
const BASMALA_TEXT='بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيمِ';
function renderLesson(){
  const s=SU.find(x=>x.n===curSurah);
  const rg=currentRange(); const R=rg.r||{start:rg.start,end:rg.end};
  let html='<div class="lessonframe"><div class="lfhead"><span>'+rg.tag+'</span><span>'+s.name+'</span></div><div class="lfbody">';
  if(basmalaInfo(curSurah)){html+='<div class="'+(qIdx===-1?'ay cur':(qIdx>=0?'ay done':'ay'))+'">'+BASMALA_TEXT+'</div>';}
  for(let i=R.start;i<=R.end;i++){
    const a=s.aya[i]; const cls=(i===qIdx)?'ay cur':((i<qIdx)?'ay done':'ay');
    html+='<div class="'+cls+'">'+a.t+'</div>';
  }
  html+='</div></div>';
  const el=document.getElementById((mode==='listen')?'lFrame':'rFrame');
  if(el)el.innerHTML=html;
  const chip=document.getElementById((mode==='listen')?'lChip':'rChip');
  if(chip)chip.textContent=rg.tag+(mode==='repeat'&&scope==='ayah'?' — آية '+((qIdx-R.start)+1)+' من '+(R.end-R.start+1):'');
}

  const L=lessonsFor(curSurah);
  lessonIdx=Math.min(lessonIdx,L.length-1);
  document.getElementById('listen').innerHTML='<div class="topbar"><button class="tbtn" onclick="stopAudio();go(\'surah\')">→ رجوع</button><span class="spacer"></span><h1>اسمع: '+FACTS[curSurah].label+'</h1></div>'+
    '<div style="text-align:center"><span class="chip" id="lChip">الحصة '+(lessonIdx+1)+' من '+L.length+'</span></div>'+
    '<div id="lFrame"></div>'+
    '<div class="controls">'+
      '<button class="cbtn small" id="lPrev" onclick="listenPrev()">⏮</button>'+
      '<button class="cbtn" style="background:'+FACTS[curSurah].color+'" id="lPlay" onclick="togglePlay()">▶</button>'+
      '<button class="cbtn small" id="lNext" onclick="listenNext()">⏭</button></div>'+
    '<label style="display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px"><input type="checkbox" id="lRepeat"> كرِّر الحصة</label>';
  qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:L[lessonIdx].start; mode='listen'; renderLesson(); playFromAyah();
  updateListenNav();

}
function updateListenNav(){
  const prev=document.getElementById('lPrev');
  const next=document.getElementById('lNext');
  if(!prev||!next)return;
  const L=lessonsFor(curSurah);
  prev.disabled=lessonIdx===0; next.disabled=lessonIdx>=L.length-1;
}
function listenPrev(){const L=lessonsFor(curSurah);if(lessonIdx>0){lessonIdx--;qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:L[lessonIdx].start;renderLesson();playFromAyah();}updateListenNav();}
function listenNext(){const L=lessonsFor(curSurah);if(lessonIdx<L.length-1){lessonIdx++;qIdx=L[lessonIdx].start;renderLesson();playFromAyah();}updateListenNav();}
function s(){return SU.find(x=>x.n===curSurah);}
function playFromAyah(doSeek){
  if(!timingReady(curSurah)){
    const chip=document.getElementById(mode==='repeat'?'rChip':'lChip');
    if(chip)chip.textContent+=' — جارٍ ضبط المزامنة...';
    waitTiming(curSurah).then(()=>{if(mode)playFromAyah();});
    return;
  }
  loadSurah(curSurah);
  if(doSeek!==false)seekSurahStart(curSurah,qIdx);
  else safePlay();
  updatePlayBtn();
}
function waitTiming(n){
  if(timingReady(n))return Promise.resolve();
  loadSurah(n);
  return new Promise(res=>{
    const t0=Date.now();
    const iv=setInterval(()=>{if(timingReady(n)||Date.now()-t0>60000){clearInterval(iv);res();}},200);
  });
}
function ensureTiming(n,cb){
  if(timingReady(n)){cb();return;}
  waitTiming(n).then(cb);
}
function togglePlay(){ if(audio.paused){safePlay();}else{audio.pause();} updatePlayBtn(); }
function updatePlayBtn(){const el=document.getElementById(mode==='repeat'?'rPlay':'lPlay');if(el)el.textContent=audio.paused?'▶':'⏸';}
function stopAudio(){audio.pause();mode=null;}
function setErr(){const el=document.getElementById('lChip');if(el)el.textContent+=' — تعذّر الصوت، تحقق من الإنترنت';}

function listenOnEnd(){
  if(mode!=='listen')return;
  const s=SU.find(x=>x.n===curSurah);
  const R=lessonRange(curSurah,lessonIdx);
  if(qIdx<R.end){qIdx++;renderLesson();playFromAyah(true);return;}
  lessonDone(curSurah,lessonIdx,'listened');
  const lr=document.getElementById('lRepeat');
  if(lr&&lr.checked){qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:R.start;renderLesson();playFromAyah();return;}
  const L=lessonsFor(curSurah);
  if(lessonIdx<L.length-1){lessonIdx++;qIdx=L[lessonIdx].start;renderLesson();playFromAyah();updateListenNav();}
  else{audio.pause();mode=null;celebration('أحسنت يا بطل! 🌟','استمعت إلى سورة '+FACTS[curSurah].label+' كاملة');}
}

function setScope(sc){
  scope=sc;
  document.querySelectorAll('.scopechip').forEach(c=>c.classList.toggle('sel',c.getAttribute('data-scope')===sc));
  if(mode!=='repeat')return;
  const s=SU.find(x=>x.n===curSurah);
  if(scope==='ayah'){qIdx=lessonsFor(curSurah)[lessonIdx].start;}
  else if(scope==='surah'){qIdx=basmalaInfo(curSurah)?-1:0;}
  else{qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:lessonsFor(curSurah)[lessonIdx].start;}
  repLeft=repeatCount-1;
  renderLesson(); playFromAyah(); updateRepeatNav();
}
function updateRepeatNav(){
  const prev=document.getElementById('rPrev');
  const next=document.getElementById('rNext');
  if(!prev||!next)return;
  const s=SU.find(x=>x.n===curSurah);
  const L=lessonsFor(curSurah);
  let atStart=false,atEnd=false;
  if(scope==='surah'){atStart=qIdx<=0;atEnd=qIdx>=s.aya.length-1;}
  else if(scope==='ayah'){const R=lessonRange(curSurah,lessonIdx);atStart=qIdx<=R.start&&lessonIdx===0;atEnd=qIdx>=R.end&&lessonIdx>=L.length-1;}
  else{atStart=lessonIdx===0;atEnd=lessonIdx>=L.length-1;}
  prev.disabled=atStart; next.disabled=atEnd;
}
function repeatPrev(){
  const s=SU.find(x=>x.n===curSurah);
  if(scope==='surah'){
    if(qIdx>0){qIdx--;}
    else if(qIdx===0&&basmalaInfo(curSurah)){qIdx=-1;}
    else return;
  }else if(scope==='ayah'){
    const R=lessonRange(curSurah,lessonIdx);
    if(qIdx>R.start){qIdx--;}
    else if(lessonIdx>0){lessonIdx--;qIdx=lessonRange(curSurah,lessonIdx).end;}
    else return;
  }else{
    if(lessonIdx>0){lessonIdx--;qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:lessonsFor(curSurah)[lessonIdx].start;}
    else return;
  }
  repLeft=repeatCount-1; renderLesson(); playFromAyah(); updateRepeatNav();
}
function repeatNext(){
  const s=SU.find(x=>x.n===curSurah);
  if(scope==='surah'){
    if(qIdx>=s.aya.length-1)return;
    qIdx++;
  }else if(scope==='ayah'){
    const R=lessonRange(curSurah,lessonIdx);
    if(qIdx<R.end){qIdx++;}
    else if(lessonIdx<lessonsFor(curSurah).length-1){lessonIdx++;qIdx=lessonRange(curSurah,lessonIdx).start;}
    else return;
  }else{
    const L=lessonsFor(curSurah);
    if(lessonIdx<L.length-1){lessonIdx++;qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:L[lessonIdx].start;}
    else return;
  }
  repLeft=repeatCount-1; renderLesson(); playFromAyah(); updateRepeatNav();
}
function toggleRepeat(){togglePlay();}
function setRepCount(n){repeatCount=n;repLeft=n-1;
  document.querySelectorAll('#rChips .ochip').forEach(c=>c.classList.toggle('sel',parseInt(c.textContent,10)===n));}
function setSpeed(v){speed=parseFloat(v);audio.playbackRate=speed;document.getElementById('rSpeed').textContent=speed+'×';}
function finishSurahRepeat(){
  audio.pause();mode=null;
  const p=prog(curSurah); const L=lessonsFor(curSurah);
  p.lessons=p.lessons||{}; L.forEach(l=>{const x=p.lessons[L.indexOf(l)]=p.lessons[L.indexOf(l)]||{};x.repeated=true;});
  refreshSurahFlags(curSurah); recordActivity(); save();
  celebration('ماشاء الله! 🌟🌟','رددت سورة '+FACTS[curSurah].label+' مع الشيخ');
}
function repeatOnEnd(){
  if(mode!=='repeat')return;
  const s=SU.find(x=>x.n===curSurah);
  const L=lessonsFor(curSurah);
  if(scope==='surah'){
    if(qIdx<s.aya.length-1){qIdx++;renderLesson();playFromAyah(true);return;}
    if(repLeft>0){repLeft--;qIdx=basmalaInfo(curSurah)?-1:0;renderLesson();playFromAyah();return;}
    finishSurahRepeat(); return;
  }
  const R=lessonRange(curSurah,lessonIdx);
  if(scope==='ayah'){
    if(repLeft>0){repLeft--;seekSurahStart(curSurah,qIdx);return;}
    if(qIdx<R.end){qIdx++;repLeft=repeatCount-1;renderLesson();playFromAyah(true);return;}
    lessonDone(curSurah,lessonIdx,'repeated');
    if(lessonIdx>=L.length-1){finishSurahRepeat();return;}
    qIdx=R.start;repLeft=repeatCount-1;renderLesson();playFromAyah();return;
  }
  if(qIdx<R.end){qIdx++;renderLesson();playFromAyah(true);return;}
  if(repLeft>0){repLeft--;qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:R.start;renderLesson();playFromAyah();return;}
  lessonDone(curSurah,lessonIdx,'repeated');
  if(lessonIdx>=L.length-1){finishSurahRepeat();return;}
  qIdx=(lessonIdx===0&&basmalaInfo(curSurah))?-1:R.start;repLeft=repeatCount-1;renderLesson();playFromAyah();
}

/* ---------- اختبار ---------- */
let quizQ=[];let quizN=0;let quizCorrect=0;
function startQuiz(){
  const s=SU.find(x=>x.n===curSurah);
  const n=Math.min(8,s.aya.length);
  const idx=[...Array(s.aya.length).keys()].sort(()=>Math.random()-0.5).slice(0,n);
  const pool=[];SU.forEach(x=>x.aya.forEach(a=>pool.push(a)));
  quizQ=idx.map(i=>{const t=s.aya[i];const cand=[];let guard=0;
    while(cand.length<2&&guard++<200){const c=pool[Math.floor(Math.random()*pool.length)];
      if(c.t!==t.t&&!cand.some(x=>x.t===c.t))cand.push(c);}
    return {idx:i,target:t,opts:[t,...cand].sort(()=>Math.random()-0.5)};});
  quizN=0;quizCorrect=0;
  document.getElementById('quiz').innerHTML='<div class="topbar"><button class="tbtn" onclick="stopAudio();go(\'surah\')">→ رجوع</button><span class="spacer"></span><h1>احفظ: '+FACTS[curSurah].label+'</h1></div>';
  mode='quiz'; renderQuizQ(); go('quiz');
}
function renderQuizQ(){
  const q=quizQ[quizN];
  const el=document.getElementById('quiz');
  el.innerHTML='<div class="topbar"><button class="tbtn" onclick="stopAudio();go(\'surah\')">→ رجوع</button><span class="spacer"></span><h1>احفظ: '+FACTS[curSurah].label+'</h1></div>'+
    '<div style="text-align:center"><span class="chip" id="qChip">سؤال '+(quizN+1)+' من '+quizQ.length+' — أصبت '+quizCorrect+'</span></div>'+
    '<div style="text-align:center;font-size:15px;color:#555">استمع جيداً ثم اختر الآية الصحيحة</div>'+
    '<div style="text-align:center;margin:12px 0"><button style="border:none;border-radius:50%;width:70px;height:70px;background:'+FACTS[curSurah].color+';color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2)" onclick="quizPlay(quizQ[quizN].idx)">🔊</button></div>'+
    '<div style="text-align:center;font-size:34px;opacity:.3">❓</div>'+
    '<div style="margin-top:8px" id="qOpts">'+q.opts.map((o,i)=>'<div class="opt" data-i="'+i+'" onclick="pickQ('+i+')">'+o.t+'</div>').join('')+'</div>';
  quizPlay(q.idx);
}
function quizPlay(idx){
  ensureTiming(curSurah,()=>{if(mode!=='quiz')return;loadSurah(curSurah);seekSurahStart(curSurah,idx);});
}
function pickQ(i){
  const q=quizQ[quizN];const opts=document.getElementById('qOpts').children;
  if(opts[i].classList.contains('correct')||opts[i].classList.contains('wrong'))return;
  const isRight=q.opts[i].t===q.target.t;
  if(isRight){quizCorrect++;audio.pause();
    opts[i].classList.add('correct');[0,1,2].forEach(j=>{if(j!==i)opts[j].classList.add('dim');});
    setTimeout(()=>{quizN++; if(quizN<quizQ.length)renderQuizQ(); else finishQuiz();},1100);
  }else{opts[i].classList.add('wrong');
    setTimeout(()=>opts[i].classList.remove('wrong'),600);}
}
function finishQuiz(){
  const total=quizQ.length;const needed=Math.ceil(total*0.7);const passed=quizCorrect>=needed;
  const el=document.getElementById('quiz');
  el.innerHTML='<div style="text-align:center;padding:40px 10px">'+
    '<div style="font-size:70px">'+(passed?'🎉':'💪')+'</div>'+
    '<h2 style="font-size:22px;margin:10px 0">'+(passed?'أحسنت! أصبت '+quizCorrect+' من '+total+' واجتزت الاختبار!':'لا بأس يا بطل! أصبت '+quizCorrect+' من '+total+'، حاول مرة أخرى!')+'</h2>'+
    '<p style="color:#777">إجابات صحيحة من أول مرة: '+quizCorrect+' من '+total+'</p>'+
    (!passed?'<button class="btn primary" onclick="startQuiz()">أعد المحاولة</button>':'')+
    '<button class="btn outline" onclick="go(\'surah\')">العودة للسورة</button></div>';
  if(passed){mark(curSurah,'quiz');celebration('مبروك! 🌟🌟🌟','حفظت سورة '+FACTS[curSurah].label+' يا بطل!');}
  mode=null;
}

/* ---------- مزامنة الصوت ---------- */
let lastReseek=0;
let lastBoundary=0;
let ayahTimer=null;
function ayahTick(){
  if(!mode||mode==='quiz'||audio.paused)return;
  const m=timingMap(curSurah);
  if(!m)return;
  let start,end;
  if(qIdx===-1){
    const b=basmalaInfo(curSurah); if(!b)return; start=b.s; end=playbackEnd(curSurah,-1);
  }else{
    const a=SU.find(x=>x.n===curSurah).aya[qIdx];
    const tm=m[a.n]; if(!tm)return; start=tm.s; end=playbackEnd(curSurah,qIdx);
  }
  const t=audio.currentTime*1000;
  if(t>=end){
    if(Date.now()-lastBoundary<150)return;
    lastBoundary=Date.now();
    audio.pause();
    setTimeout(()=>{if(mode==='listen')listenOnEnd();else if(mode==='repeat')repeatOnEnd();},450);
  } else if(t<start-200&&Date.now()-lastReseek>800){
    lastReseek=Date.now();
    seekSurahStart(curSurah,qIdx);
  }
}
function startAyahMonitor(){if(!ayahTimer)ayahTimer=setInterval(ayahTick,30);}
function stopAyahMonitor(){if(ayahTimer){clearInterval(ayahTimer);ayahTimer=null;}}
audio.addEventListener('play',startAyahMonitor);
audio.addEventListener('pause',stopAyahMonitor);
audio.addEventListener('play',updatePlayBtn);
audio.addEventListener('pause',updatePlayBtn);
audio.addEventListener('timeupdate',ayahTick);
audio.addEventListener('error',setErr);

/* ---------- لوحة الإنجاز ---------- */

  document.getElementById('board').innerHTML='<div class="topbar"><button class="tbtn" onclick="go(\'home\')">→ رجوع</button><span class="spacer"></span><h1>لوحتي 🌟</h1></div>'+
    '<div class="summary"><div class="barwrap"><h3>'+Math.round(sm.comp/sm.all*100)+'% من جزء عمّ</h3><div class="bar"><div style="width:'+Math.round(sm.comp/sm.all*100)+'%"></div></div></div>'+
    '<div class="stat"><div class="v">'+sm.comp+'</div><div class="l">سورة 📗</div></div>'+
    '<div class="stat"><div class="v">'+sm.st+'</div><div class="l">نجمة ⭐</div></div>'+
    '<div class="stat"><div class="v">'+streak()+'</div><div class="l">أيام 🔥</div></div>'+
    '<div class="stat"><div class="v">'+sm.ayahs+'</div><div class="l">آية 📖</div></div></div>'+
    '<h3 style="margin:10px 0 8px;font-size:20px;font-weight:700">سور جزء عمّ</h3>'+rows;
}

/* ---------- ركن الوالدين ---------- */

  const dl=Object.keys(S.progress).filter(k=>S.progress[k]).length;
  document.getElementById('parents').innerHTML='<div class="topbar"><button class="tbtn" onclick="go(\'home\')">→ رجوع</button><span class="spacer"></span><h1>ركن الوالدين 👨‍👩‍👧</h1></div>'+
    '<div class="panel"><h3>🎙️ القارئ</h3><p>القارئ (برواية ورش عن نافع):</p>'+
    '<div class="recchips">'+RECITERS.map(r=>'<button class="recchip'+(reciter.id===r.id?' sel':'')+'" onclick="setParentReciter(\''+r.id+'\')">'+r.name+'</button>').join('')+'</div></div>'+
    '<div class="panel"><h3>📖 عدد آيات الحصة</h3><p>كل حصة مقطع ثابت من الآيات (الافتراضي 5 آيات ≈ 3 أسطر):</p>'+
    '<div class="optchips">'+[3,4,5,6,7,8].map(n=>'<button class="ochip'+(n===ayahsPerLesson?' sel':'')+'" onclick="setAyahsPerLesson('+n+')">'+n+'</button>').join('')+'</div></div>'+
    '<div class="panel"><h3>💾 التنزيل دون اتصال</h3><p>في المعاينة يتم فتح ملفات الصوت من الإنترنت. في تطبيق الهاتف يمكن تنزيل جميع السور (37 ملفاً) للعمل دون إنترنت.</p>'+

    '<div class="sliderrow"><span>السرعة:</span><input type="range" min="0.5" max="1.5" step="0.25" value="'+speed+'" oninput="setSpeed(this.value)"><b>'+speed+'×</b></div></div>'+
    '<div class="panel"><h3>🗑️ إدارة التقدم</h3><button class="btn red" onclick="resetAll()">إعادة تعيين كل التقدم</button></div>'+

    '<a class="btn gold" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/212605706006" target="_blank" rel="noopener">💬 تواصل عبر واتساب</a></div>'+
    '<div class="panel"><h3>ℹ️ نبذة</h3><p>تطبيق «براعم جوهرة» لتعليم الأطفال حفظ جزء عمّ برواية ورش عن نافع. النص من القرآن الكريم برواية ورش، والقارئ: محمود خليل الحصري (ورش) من mp3quran.net. كل آية تُعرض بفاصل صوتي واضح عن التي قبلها وبعدها.</p></div>';
}
function setParentReciter(id){setReciter(id);renderParents();}
function setAyahsPerLesson(n){ayahsPerLesson=n;
  try{localStorage.setItem('ammaAyahsPerLesson',String(n));}catch(e){}
  renderParents(); renderSurah();}
function setDefRep(n){repeatCount=n;document.getElementById('dRep').textContent=n;
  document.querySelectorAll('#parents .ochip').forEach(c=>c.classList.toggle('sel',parseInt(c.textContent)===n));}
function resetAll(){if(confirm('هل تريد مسح كل التقدم والنجوم؟')){S={progress:{},days:[]};save();renderParents();go('home');}}

/* ---------- احتفال ---------- */
function celebration(title,msg){
  const ov=document.createElement('div');ov.className='celebrate';
  ov.innerHTML='<div class="box"><div class="big">🎉</div><h2>'+title+'</h2><p>'+msg+'</p><div class="stars">⭐ ⭐ ⭐</div><button class="btn primary" onclick="this.closest(\'.celebrate\').remove()">رائع!</button></div>';
  document.body.appendChild(ov);
  const colors=['#FFD54F','#4FC3F7','#81C784','#F48FB1','#CE93D8','#FF8A65'];
  for(let i=0;i<50;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'%';c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*0.4)+'s';
    c.style.width=(6+Math.random()*7)+'px';c.style.height=(8+Math.random()*8)+'px';
    ov.appendChild(c);}
}

/* ---------- تثبيت التطبيق ---------- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='inline-block';
});
function installApp(){
  if(!deferredPrompt){
    alert('لتثبيت التطبيق: افتح قائمة المتصفح ⋮ ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none';});
}
window.addEventListener('appinstalled',()=>{deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none';});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload();}});
});}

renderHome();
